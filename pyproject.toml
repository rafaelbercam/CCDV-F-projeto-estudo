[project]
name = "ccdv-study"
version = "0.1.0"
description = "Projeto de estudo para a certificação Claude Certified Developer - Foundations (CCDV-F)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    # FastMCP vive na linha 1.x do SDK; a 2.x renomeou para MCPServer.
    "mcp>=1.2,<2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ccdv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: chama a API real (precisa de ANTHROPIC_API_KEY)"]
addopts = "-m 'not live'"
